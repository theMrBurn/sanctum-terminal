[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum-terminal"
version = "0.1.0"
dependencies = [
    "panda3d>=1.10.14",
    "rich>=13.0.0",
    # Permanent Objects journal lexicon (offline NLP, no LLM, no network at runtime).
    # Model installed separately: `python -m spacy download en_core_web_sm`
    "spacy>=3.7,<4.0",
    # 3D renderer (native_renderer.py / renderer_bridge.py).
    "wgpu>=0.15",
]

[tool.setuptools]
# Flat-layout app: top-level modules are listed explicitly; the
# core/clients/utils packages are auto-discovered below.
py-modules = ["sanctum_terminal", "brain_server", "godot_export", "renderer_bridge", "native_renderer"]

[tool.setuptools.packages.find]
include = ["core*", "clients*", "utils*"]

[project.scripts]
sanctum = "sanctum_terminal:main"

[tool.pytest.ini_options]
# Don't collect tests from archived legacy / orphan directories.
# See `.claude/audit_2026-05-06.md` A7 / A14.
norecursedirs = [
    "docs/archive",
    ".git",
    "__pycache__",
    "node_modules",
]